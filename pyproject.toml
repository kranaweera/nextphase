[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftwatch"
version = "0.1.0.dev0"
description = "Modality-agnostic, model-agnostic post-deployment monitoring for ML models."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "DriftWatch contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyarrow>=14.0",
    "typer>=0.12",
    "httpx>=0.27",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
text = ["sentence-transformers>=2.2"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
s3 = ["boto3>=1.34"]
all = ["driftwatch[text,postgres,s3]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "build>=1.2"]

[project.scripts]
driftwatch = "driftwatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
# Kept ahead of requires-python: numpy's own type stubs use PEP 695 syntax
# that mypy only parses when targeting 3.12+, independent of what we support.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
